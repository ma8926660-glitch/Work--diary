Android Kotlin प्रोजेक्ट में ये 2 compile errors ठीक करो:
1. HomeScreen.kt लाइन 436: 'totalPaymentsOut' unresolved। ViewModel में इसे बनाओ (सब मज़दूरों को दी कुल पेमेंट) या सही मौजूदा variable इस्तेमाल करो।
2. LabourAccountsScreen.kt लाइन 424: 'lbl_quick_pay' unresolved। values/strings.xml और values-hi/strings.xml में यह string जोड़ो।
पूरे प्रोजेक्ट में देखो कि कोई और अपरिभाषित reference तो नहीं, और पूरा project दोबारा बनाओ ताकि `gradle assembleDebug` बिना error चले।
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project ZIP
        run: |
          mkdir -p extracted
          unzip -o ./*.zip -d extracted

      - name: Find Gradle version
        id: gradle_version
        shell: bash
        run: |
          PROPS=$(find extracted -type f -name gradle-wrapper.properties | head -n 1)
          if [ -z "$PROPS" ]; then
            echo "ERROR: gradle-wrapper.properties not found"
            exit 1
          fi
          VERSION=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' "$PROPS")
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not read Gradle version"
            cat "$PROPS"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Build debug APK
        shell: bash
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: work-diary-debug-apk
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error

Android Kotlin प्रोजेक्ट में दो काम करो।

भाग 1: compile errors ठीक करो।
1. HomeScreen.kt लाइन 436: 'totalPaymentsOut' unresolved। ViewModel में बनाओ (सब मज़दूरों को दी कुल पेमेंट का जोड़) या सही मौजूदा variable इस्तेमाल करो।
2. LabourAccountsScreen.kt लाइन 424: 'lbl_quick_pay' unresolved। values/strings.xml ("Quick Pay") और values-hi/strings.xml ("त्वरित भुगतान") दोनों में जोड़ो।
3. पूरे प्रोजेक्ट में जाँचो कि हर R.string, variable, function और class कहीं परिभाषित भी है। कहीं और ऐसा मिले तो ठीक करो।

भाग 2: "8. Android App (.ZIP)" का डाउनलोड ठीक करो। अभी ZIP की जगह एक HTML "Cookie check" पेज डाउनलोड होता है।
1. ZIP पूरी तरह browser के अंदर JSZip से बनाओ और Blob URL से सीधे डाउनलोड कराओ। किसी server, बाहरी लिंक या redirect का इस्तेमाल मत करो।
2. फ़ाइल का नाम ठीक `my-work-diary-android.zip` हो।
3. ZIP में पूरा project हो: app/, build.gradle.kts, settings.gradle.kts, gradle.properties, gradlew, gradle/wrapper।
4. बैकअप के लिए उसी सेक्शन में हर फ़ाइल की सूची दिखाओ, हर फ़ाइल के आगे "Copy" बटन के साथ।
5. डाउनलोड के बाद स्क्रीन पर ZIP का साइज़ (KB) दिखाओ।

आख़िर में `gradle assembleDebug` बिना compile error के चलना चाहिए।
